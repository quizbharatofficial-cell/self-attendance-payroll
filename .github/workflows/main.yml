name: Build Signed Self HRMS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Copy web files to Android assets
        run: |
          mkdir -p app/src/main/assets
          cp -f *.html app/src/main/assets/ || true
          cp -f *.css app/src/main/assets/ || true
          cp -f *.js app/src/main/assets/ || true
          cp -f *.json app/src/main/assets/ || true
          cp -f *.png app/src/main/assets/ || true

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/self-hrms-release.jks
          test -s app/self-hrms-release.jks

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle :app:assembleRelease

      - name: Rename Release APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/Self-HRMS-v1.0.4.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Self-HRMS-v1.0.4
          path: app/build/outputs/apk/release/Self-HRMS-v1.0.4.apk
          retention-days: 30
