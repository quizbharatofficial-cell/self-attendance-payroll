name: Generate Signing Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore self-hrms-release.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias selfhrms \
            -storepass "SelfHRMS2026Secure" \
            -keypass "SelfHRMS2026Secure" \
            -dname "CN=Self HRMS, OU=Android, O=Self HRMS, L=Bhagalpur, ST=Bihar, C=IN"

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: self-hrms-keystore
          path: self-hrms-release.jks
          retention-days: 1