<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Employee Master - SELF HRMS</title>

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="topbar">
  <div>
    <h1>SELF HRMS</h1>
    <p>Employee Master</p>
  </div>
</header>

<main class="container">

  <div class="page-heading">
    <h2>Employee Master</h2>
    <p>Create and manage employee records</p>
  </div>

  <div class="actions-bar">
    <a href="../index.html" class="btn btn-secondary">
      ← Dashboard
    </a>
  </div>


  <section class="form-card">

    <form id="employeeForm">

      <input type="hidden" id="recordId">

      <h3>Basic Information</h3>

      <div class="form-grid">

        <div class="field">
          <label>Employee Code *</label>
          <input
            type="text"
            id="employeeCode"
            placeholder="Employee code"
            required
          >
        </div>

        <div class="field">
          <label>Employee Name *</label>
          <input
            type="text"
            id="employeeName"
            placeholder="Full name"
            required
          >
        </div>

        <div class="field">
          <label>Father / Spouse Name</label>
          <input
            type="text"
            id="fatherSpouseName"
            placeholder="Father or spouse name"
          >
        </div>

        <div class="field">
          <label>Date of Birth</label>
          <input type="date" id="dob">
        </div>

        <div class="field">
          <label>Gender</label>
          <select id="gender">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field">
          <label>Mobile Number</label>
          <input
            type="tel"
            id="mobile"
            placeholder="Mobile number"
          >
        </div>

        <div class="field">
          <label>Email</label>
          <input
            type="email"
            id="email"
            placeholder="Email address"
          >
        </div>

        <div class="field">
          <label>Date of Joining *</label>
          <input
            type="date"
            id="joiningDate"
            required
          >
        </div>

      </div>


      <h3>Employment Information</h3>

      <div class="form-grid">

        <div class="field">
          <label>Branch *</label>
          <select id="branch" required>
            <option value="">Select Branch</option>
          </select>
        </div>

        <div class="field">
          <label>Department *</label>
          <select id="department" required>
            <option value="">Select Department</option>
          </select>
        </div>

        <div class="field">
          <label>Designation *</label>
          <select id="designation" required>
            <option value="">Select Designation</option>
          </select>
        </div>

        <div class="field">
          <label>Shift</label>
          <select id="shift">
            <option value="">Select Shift</option>
          </select>
        </div>

        <div class="field">
          <label>Employment Type</label>
          <select id="employmentType">
            <option value="Permanent">Permanent</option>
            <option value="Temporary">Temporary</option>
            <option value="Contract">Contract</option>
            <option value="Trainee">Trainee</option>
            <option value="Probation">Probation</option>
          </select>
        </div>

        <div class="field">
          <label>Status</label>
          <select id="status">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>

      </div>


      <h3>Salary & Statutory Information</h3>

      <div class="form-grid">

        <div class="field">
          <label>Monthly Salary</label>
          <input
            type="number"
            id="monthlySalary"
            min="0"
            step="0.01"
            placeholder="Enter monthly salary"
          >
        </div>

        <div class="field">
          <label>Salary Payment Mode</label>
          <select id="paymentMode">
            <option value="Bank">Bank</option>
            <option value="Cash">Cash</option>
            <option value="Cheque">Cheque</option>
          </select>
        </div>

        <div class="field">
          <label>PF Number / UAN</label>
          <input
            type="text"
            id="uan"
            placeholder="UAN / PF number"
          >
        </div>

        <div class="field">
          <label>PF Applicable</label>
          <select id="pfApplicable">
            <option value="No">No</option>
            <option value="Yes">Yes</option>
          </select>
        </div>

        <div class="field">
          <label>ESI Number</label>
          <input
            type="text"
            id="esiNumber"
            placeholder="ESI number"
          >
        </div>

        <div class="field">
          <label>ESI Applicable</label>
          <select id="esiApplicable">
            <option value="No">No</option>
            <option value="Yes">Yes</option>
          </select>
        </div>

      </div>


      <h3>Bank Information</h3>

      <div class="form-grid">

        <div class="field">
          <label>Account Holder Name</label>
          <input
            type="text"
            id="accountHolder"
            placeholder="Account holder name"
          >
        </div>

        <div class="field">
          <label>Bank Name</label>
          <input
            type="text"
            id="bankName"
            placeholder="Bank name"
          >
        </div>

        <div class="field">
          <label>Account Number</label>
          <input
            type="text"
            id="accountNumber"
            placeholder="Account number"
          >
        </div>

        <div class="field">
          <label>IFSC Code</label>
          <input
            type="text"
            id="ifsc"
            placeholder="IFSC code"
          >
        </div>

      </div>


      <h3>Address</h3>

      <div class="form-grid">

        <div class="field">
          <label>State</label>
          <input type="text" id="state">
        </div>

        <div class="field">
          <label>City</label>
          <input type="text" id="city">
        </div>

        <div class="field">
          <label>PIN Code</label>
          <input type="text" id="pin">
        </div>

      </div>

      <div class="field">
        <label>Full Address</label>
        <textarea
          id="address"
          rows="3"
          placeholder="Employee address"
        ></textarea>
      </div>


      <div class="form-actions">

        <button
          type="submit"
          class="btn btn-primary"
          id="saveBtn"
        >
          Save Employee
        </button>

        <button
          type="button"
          class="btn btn-secondary"
          id="cancelBtn"
        >
          Clear
        </button>

      </div>

      <p id="message"></p>

    </form>

  </section>


  <section class="table-card">

    <div class="table-header">

      <h3>Employee List</h3>

      <input
        type="search"
        id="employeeSearch"
        placeholder="Search employee..."
      >

    </div>

    <div class="table-responsive">

      <table>

        <thead>
          <tr>
            <th>Code</th>
            <th>Employee</th>
            <th>Branch</th>
            <th>Department</th>
            <th>Designation</th>
            <th>Mobile</th>
            <th>Joining Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="employeeTable"></tbody>

      </table>

    </div>

  </section>

</main>

<div id="toast" class="toast"></div>

<script src="../js/modules/employee.js"></script>

</body>
</html>
