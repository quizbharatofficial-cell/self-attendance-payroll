<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Designation Master - SELF HRMS</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="topbar">
  <div>
    <h1>SELF HRMS</h1>
    <p>Designation Master</p>
  </div>
</header>

<main class="container">

  <div class="page-heading">
    <h2>Designation Master</h2>
    <p>Create and manage employee designations</p>
  </div>

  <div class="actions-bar">
    <a href="../index.html" class="btn btn-secondary">
      ← Dashboard
    </a>

    <a href="department.html" class="btn btn-secondary">
      Department Master
    </a>
  </div>

  <section class="form-card">

    <form id="designationForm">

      <input type="hidden" id="recordId">

      <div class="form-grid">

        <div class="field">
          <label>Designation Code *</label>
          <input
            type="text"
            id="designationCode"
            placeholder="Enter designation code"
            required
          >
        </div>

        <div class="field">
          <label>Designation Name *</label>
          <input
            type="text"
            id="designationName"
            placeholder="Enter designation name"
            required
          >
        </div>

        <div class="field">
          <label>Department</label>
          <select id="department">
            <option value="">Select Department</option>
          </select>
        </div>

        <div class="field">
          <label>Grade / Level</label>
          <input
            type="text"
            id="grade"
            placeholder="Enter grade or level"
          >
        </div>

        <div class="field">
          <label>Status</label>
          <select id="status">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>

      </div>

      <div class="field">
        <label>Description</label>
        <textarea
          id="description"
          rows="3"
          placeholder="Enter designation description"
        ></textarea>
      </div>

      <div class="form-actions">

        <button
          type="submit"
          class="btn btn-primary"
          id="saveBtn"
        >
          Save Designation
        </button>

        <button
          type="button"
          class="btn btn-secondary"
          id="cancelBtn"
        >
          Clear
        </button>

      </div>

      <p id="message"></p>

    </form>

  </section>


  <section class="table-card">

    <div class="table-header">

      <h3>Designation List</h3>

      <input
        type="search"
        id="designationSearch"
        placeholder="Search designation..."
      >

    </div>

    <div class="table-responsive">

      <table>

        <thead>
          <tr>
            <th>Code</th>
            <th>Designation</th>
            <th>Department</th>
            <th>Grade / Level</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="designationTable"></tbody>

      </table>

    </div>

  </section>

</main>

<div id="toast" class="toast"></div>

<script src="../js/modules/designation.js"></script>

</body>
</html>
