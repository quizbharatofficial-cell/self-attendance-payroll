<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Salary Component Master - SELF HRMS</title>

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="topbar">
  <div>
    <h1>SELF HRMS</h1>
    <p>Salary Component Master</p>
  </div>
</header>

<main class="container">

  <div class="page-heading">
    <h2>Salary Component Master</h2>
    <p>Configure payroll earnings and deductions</p>
  </div>

  <div class="actions-bar">
    <a href="../index.html" class="btn btn-secondary">
      ← Dashboard
    </a>
  </div>


  <section class="form-card">

    <form id="componentForm">

      <input type="hidden" id="recordId">


      <div class="form-grid">

        <div class="field">
          <label>Component Code *</label>

          <input
            type="text"
            id="componentCode"
            placeholder="Enter component code"
            required
          >
        </div>


        <div class="field">
          <label>Component Name *</label>

          <input
            type="text"
            id="componentName"
            placeholder="Enter component name"
            required
          >
        </div>


        <div class="field">
          <label>Component Type *</label>

          <select id="componentType" required>

            <option value="Earning">
              Earning
            </option>

            <option value="Deduction">
              Deduction
            </option>

          </select>
        </div>


        <div class="field">
          <label>Calculation Type *</label>

          <select id="calculationType">

            <option value="Fixed">
              Fixed Amount
            </option>

            <option value="Percentage">
              Percentage
            </option>

            <option value="Manual">
              Manual
            </option>

          </select>
        </div>


        <div class="field" id="amountField">
          <label>Default Amount</label>

          <input
            type="number"
            id="defaultAmount"
            min="0"
            step="0.01"
            value="0"
          >
        </div>


        <div class="field" id="percentageField">
          <label>Percentage (%)</label>

          <input
            type="number"
            id="percentage"
            min="0"
            step="0.01"
            value="0"
          >
        </div>


        <div class="field" id="basedOnField">
          <label>Percentage Based On</label>

          <select id="basedOn">

            <option value="">
              Select Base
            </option>

            <option value="Basic">
              Basic
            </option>

            <option value="Gross">
              Gross
            </option>

          </select>
        </div>


        <div class="field">
          <label>Attendance Linked</label>

          <select id="attendanceLinked">

            <option value="Yes">
              Yes
            </option>

            <option value="No">
              No
            </option>

          </select>
        </div>


        <div class="field">
          <label>Include in Gross</label>

          <select id="includeInGross">

            <option value="Yes">
              Yes
            </option>

            <option value="No">
              No
            </option>

          </select>
        </div>


        <div class="field">
          <label>Include in Net Salary</label>

          <select id="includeInNet">

            <option value="Yes">
              Yes
            </option>

            <option value="No">
              No
            </option>

          </select>
        </div>


        <div class="field">
          <label>PF Applicable</label>

          <select id="pfApplicable">

            <option value="No">
              No
            </option>

            <option value="Yes">
              Yes
            </option>

          </select>
        </div>


        <div class="field">
          <label>ESI Applicable</label>

          <select id="esiApplicable">

            <option value="No">
              No
            </option>

            <option value="Yes">
              Yes
            </option>

          </select>
        </div>


        <div class="field">
          <label>Display Order</label>

          <input
            type="number"
            id="displayOrder"
            min="0"
            step="1"
            value="0"
          >
        </div>


        <div class="field">
          <label>Status</label>

          <select id="status">

            <option value="Active">
              Active
            </option>

            <option value="Inactive">
              Inactive
            </option>

          </select>
        </div>

      </div>


      <div class="field">
        <label>Description</label>

        <textarea
          id="description"
          rows="3"
          placeholder="Optional component description"
        ></textarea>
      </div>


      <div class="form-actions">

        <button
          type="submit"
          class="btn btn-primary"
          id="saveBtn"
        >
          Save Component
        </button>

        <button
          type="button"
          class="btn btn-secondary"
          id="cancelBtn"
        >
          Clear
        </button>

      </div>

      <p id="message"></p>

    </form>

  </section>


  <section class="table-card">

    <div class="table-header">

      <h3>Salary Component List</h3>

      <input
        type="search"
        id="componentSearch"
        placeholder="Search component..."
      >

    </div>


    <div class="table-responsive">

      <table>

        <thead>
          <tr>
            <th>Code</th>
            <th>Component</th>
            <th>Type</th>
            <th>Calculation</th>
            <th>Attendance</th>
            <th>PF</th>
            <th>ESI</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="componentTable"></tbody>

      </table>

    </div>

  </section>

</main>


<div id="toast" class="toast"></div>


<script src="../js/modules/salary-component.js"></script>

</body>
</html>
