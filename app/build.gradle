plugins {
    id 'com.android.application'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.abss.selfattendance'
    compileSdk 36

    defaultConfig {
        applicationId 'com.abss.selfattendance'
        minSdk 23
        targetSdk 36
        versionCode 5
        versionName '1.0.4'
    }

    signingConfigs {
        release {
            def localStore = keystoreProperties['storeFile']
            def envStore = System.getenv('KEYSTORE_FILE')

            if (localStore) {
                storeFile rootProject.file(localStore)
            } else if (envStore) {
                storeFile file(envStore)
            } else {
                storeFile file('self-hrms-release.jks')
            }

            storePassword keystoreProperties['storePassword'] ?: System.getenv('KEYSTORE_PASSWORD')
            keyAlias keystoreProperties['keyAlias'] ?: System.getenv('KEY_ALIAS') ?: 'selfhrms'
            keyPassword keystoreProperties['keyPassword'] ?: System.getenv('KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }
}

configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.16.0'
}
